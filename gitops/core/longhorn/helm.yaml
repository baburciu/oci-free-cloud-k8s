apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
spec:
  interval: 5m
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: longhorn
      version: '1.11.3'
      sourceRef:
        kind: HelmRepository
        name: longhorn
      interval: 5m
  releaseName: longhorn
  values:
    global:
      imageRegistry: docker.io
    defaultSettings:
      storageMinimalAvailablePercentage: 10
      # live-upgrade volume engines after a Longhorn upgrade, one volume per node at a time
      concurrentAutomaticEngineUpgradePerNodeLimit: 1
    defaultBackupStore:
      # backupTarget comes from valuesFrom above
      backupTargetCredentialSecret: longhorn-backup-s3
      pollInterval: 3600
    persistence:
      defaultClassReplicaCount: 2
    ingress:
      enabled: false
  # optional so a missing Vault secret never blocks installing the storage layer;
  # the backup target is set on the next reconcile once the Secret exists
  valuesFrom:
    - kind: Secret
      name: longhorn-backup-s3
      valuesKey: BACKUP_TARGET
      targetPath: defaultBackupStore.backupTarget
      optional: true
