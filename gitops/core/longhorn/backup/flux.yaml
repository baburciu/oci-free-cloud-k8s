apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-backup
  namespace: flux-system
spec:
  # RecurringJob CRD is installed by the longhorn HelmRelease
  dependsOn:
    - name: longhorn
  interval: 1h
  path: "./gitops/core/longhorn/backup"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
