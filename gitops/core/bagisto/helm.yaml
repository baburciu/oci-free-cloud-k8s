apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: bagisto
spec:
  interval: 1h
  ref:
    branch: main
  url: https://github.com/baburciu/bagisto-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bagisto
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: .
      sourceRef:
        kind: GitRepository
        name: bagisto
      interval: 5m
  releaseName: bagisto
  values:
    image:
      repository: docker.io/bogdanadrianburciu/bagisto
      tag: v2.5.0
    app:
      name: "Delaleu Systems Marketplace"
      env: "production"
      debug: false
      key: "base64:QUX9qmrwebO2hl0zhoQ4Lz2+YlJtpsZzz4wrs1rqTAY="
      url: "http://store.delaleusystems.com"
      timezone: "UTC"
      locale: "ro"
      currency: "RON"
    storage:
      storageClass: longhorn
      size: 3Gi
      # opt into the Longhorn S3 backup (see gitops/core/longhorn/backup)
      labels:
        recurring-job.longhorn.io/source: enabled
        recurring-job-group.longhorn.io/s3-backup: enabled
    mysqlStandalone:
      persistence:
        size: 3Gi
        # only applied to newly created PVCs: volumeClaimTemplates are immutable on an existing StatefulSet
        labels:
          recurring-job.longhorn.io/source: enabled
          recurring-job-group.longhorn.io/s3-backup: enabled
    replicaCount: 1
