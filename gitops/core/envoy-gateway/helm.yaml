apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: envoyproxy
spec:
  interval: 5m
  type: oci
  url: oci://docker.io/envoyproxy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 2m
  timeout: 5m
  chart:
    spec:
      chart: gateway-helm
      version: "1.9.2"
      sourceRef:
        kind: HelmRepository
        name: envoyproxy
      interval: 5m
  releaseName: envoy-gateway
  dependsOn:
    - name: envoy-gateway-crds
  values:
    # Gateway API CRDs come from gitops/core/gatewayapi-crds, Envoy Gateway CRDs from envoy-gateway-crds
    crds:
      enabled: false
---
# Envoy Gateway CRDs only; Gateway API CRDs (and their safe-upgrades policy) are owned by gitops/core/gatewayapi-crds
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway-crds
spec:
  interval: 1h
  timeout: 5m
  chart:
    spec:
      chart: gateway-crds-helm
      version: "1.9.2"
      sourceRef:
        kind: HelmRepository
        name: envoyproxy
      interval: 5m
  releaseName: envoy-gateway-crds
  values:
    crds:
      gatewayAPI:
        enabled: false
      envoyGateway:
        enabled: true
  # never delete the CRDs (and with them every SecurityPolicy/EnvoyProxy) if this release is removed
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: CustomResourceDefinition
            patch: |
              - op: add
                path: /metadata/annotations/helm.sh~1resource-policy
                value: keep
