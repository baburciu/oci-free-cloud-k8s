apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: envoyproxy
spec:
  interval: 5m
  type: oci
  url: oci://docker.io/envoyproxy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 2m
  timeout: 5m
  chart:
    spec:
      chart: gateway-helm
      version: "1.9.2"
      sourceRef:
        kind: HelmRepository
        name: envoyproxy
      interval: 5m
  releaseName: envoy-gateway
  values:
    # Gateway API CRDs come from gitops/core/gatewayapi-crds, Envoy Gateway CRDs from gitops/core/envoy-gateway-crds
    crds:
      enabled: false
